name: 检查

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 YAML 解析器
        run: npm install --no-save --no-package-lock js-yaml@4
      - name: 检查脚本语法、模块格式与覆写 YAML
        run: node .github/scripts/check.mjs
