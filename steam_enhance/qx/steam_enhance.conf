# Steam 商店增强（Quantumult X）
# 增强 Steam 商店与社区页：每个礼包的史低、各区价格对比、在线与峰值、HLTB、SteamDB 评分、DLC 史低；社区成就全球解锁率、库存市场价。
# Quantumult X 的重写不支持传参，使用默认配置（跟随商店页区服，不启用近期史低）。

[mitm]
hostname = store.steampowered.com, steamcommunity.com

[rewrite_local]
# 同源伪路径 API：页面只请求 /__steam_enhance/api/*，由脚本访问上游并直接返回
^https:\/\/store\.steampowered\.com\/__steam_enhance\/ url script-echo-response https://raw.githubusercontent.com/lonelyman0108/script/refs/heads/master/steam_enhance/scripts/steam_enhance.js

# 页面注入：商店 app/sub/bundle 页，社区个人资料 / 个人成就 / 库存页
^https:\/\/(store\.steampowered\.com\/(agecheck\/)?(app|sub|bundle)\/\d+|steamcommunity\.com\/(id|profiles)\/[^\/?#]+(\/(stats\/[^\/?#]+|inventory))?\/?([?#]|$)) url script-response-body https://raw.githubusercontent.com/lonelyman0108/script/refs/heads/master/steam_enhance/scripts/steam_enhance.js
